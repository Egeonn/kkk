name: Generate RuleSets
on:
  schedule:
    - cron: "0 */12 * * *"   # 每6小时
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      # ✅ 安装 mihomo（关键！）
      - name: 📦 Install Mihomo
        run: |
          wget -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.21/mihomo-linux-amd64-v1-go120-v1.19.21.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

      # ✅ 可选：安装 yq（解析 YAML）
      - name: 📦 Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      # ✅ 执行你的脚本
      - name: 🚀 Run Script
        run: |
          chmod +x generate_rules.sh
          ./generate_rules.sh

      # ✅ 提交变更
      - name: 📤 Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ruleset_txt

          if git diff --cached --quiet; then
            echo "✅ 无变化"
          else
            git commit -m "Update ruleset $(date -u '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
