name: Generate RuleSets

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate RuleSets
        run: |
          chmod +x generate_rules.sh
          ./generate_rules.sh

      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: release           # 指定推送到 release 分支
          publish_dir: ./ruleset_txt        # 将云端生成的 ruleset_txt 目录内容推出去
          force_orphan: true                # 每次覆盖并清空旧历史，防止仓库体积爆炸
          commit_message: "🔄 Auto update rulesets"
