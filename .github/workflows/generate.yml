name: Update Ruleset

on:
  schedule:
    - cron: "0 */12 * * *"   # 每6小时运行
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 📥 拉取仓库
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # 📦 安装 Mihomo（稳定版）
      # ==============================
      - name: Install Mihomo
        run: |
          set -e

          VERSION=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep tag_name | cut -d '"' -f4)

          echo "📦 Mihomo version: $VERSION"

          wget -O mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}/mihomo-linux-amd64-v1-go120-${VERSION}.gz"

          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/mihomo

          mihomo -v

      # ==============================
      # 📦 安装 yq（解析 YAML）
      # ==============================
      - name: Install yq
        run: |
          sudo apt-get update
          sudo apt-get install -y yq

      # ==============================
      # 🚀 运行脚本
      # ==============================
      - name: Run Ruleset Script
        run: |
          chmod +x ./your_script.sh
          ./your_script.sh

      # ==============================
      # 📤 提交变更
      # ==============================
      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ruleset_txt

          if git diff --cached --quiet; then
            echo "✅ 无变化"
          else
            git commit -m "Update ruleset $(date -u '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
